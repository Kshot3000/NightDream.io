<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu test (temporary)</title>
<link rel="stylesheet" href="./css/styles.css?v=20260928a" />
<link rel="stylesheet" href="./css/fx.css?v=20260928a" />
<style>
  /* Force the mobile drawer rules regardless of viewport width */
  .sidebar {
    position: fixed !important; left: 0; top: 0;
    transform: translateX(-105%) !important;
    transition: transform .2s ease;
    width: min(280px, 86vw); height: 100vh;
    z-index: 60;
  }
  .sidebar.open { transform: translateX(0) !important; }
  .menu-btn { display: inline-flex !important; }
  #teststate {
    position: fixed; bottom: 8px; left: 8px; z-index: 9999;
    background: #000; color: #0f0; font: 13px monospace;
    padding: 8px 10px; border-radius: 8px; max-width: 90vw;
  }
</style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand">
        <div><div class="brand-name">NightDream</div><div class="brand-sub">Cardano · Midnight</div></div>
      </div>
      <nav class="nav">
        <div class="nav-label">Desk</div>
        <a class="nav-item active" href="#overview" data-route="overview"><span class="nav-icon">◈</span> Overview</a>
        <a class="nav-item" href="#markets" data-route="markets"><span class="nav-icon">◎</span> Markets</a>
        <a class="nav-item" href="#token/ADA" data-route="token"><span class="nav-icon">✦</span> Token</a>
        <a class="nav-item" href="#portfolio" data-route="portfolio"><span class="nav-icon">◉</span> Portfolio</a>
        <div class="nav-label">DeFi</div>
        <a class="nav-item" href="#dex" data-route="dex"><span class="nav-icon">⇄</span> DEX / Liquidity</a>
        <div class="nav-label">Differentiator</div>
        <a class="nav-item" href="#midnight" data-route="midnight"><span class="nav-icon">☾</span> Midnight</a>
        <a class="nav-item" href="#watchlist" data-route="watchlist"><span class="nav-icon">★</span> Watchlist</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false" type="button">☰</button>
        <div class="topbar-actions"><span class="network-chip"><span class="dot"></span><span>Mainnet + Midnight</span></span></div>
      </header>
      <main class="content"><p style="color:#fff">Menu test page. Tap the hamburger, then a nav link.</p></main>
    </div>
  </div>
  <div id="teststate">state: closed | hash: (none)</div>
<script>
  function syncState() {
    document.querySelector('#teststate').textContent =
      'state: ' + (document.querySelector('#sidebar').classList.contains('open') ? 'OPEN' : 'closed') +
      ' | overlay: ' + (document.querySelector('#sidebarOverlay').classList.contains('show') ? 'SHOW' : 'hidden') +
      ' | hash: ' + (location.hash || '(none)');
  }
  function closeSidebar() {
    document.querySelector('#sidebar')?.classList.remove('open');
    document.querySelector('#sidebarOverlay')?.classList.remove('show');
    document.querySelector('#menuBtn')?.setAttribute('aria-expanded', 'false');
    syncState();
  }
  document.querySelector('#menuBtn')?.addEventListener('click', () => {
    const sb = document.querySelector('#sidebar');
    const open = !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    document.querySelector('#sidebarOverlay').classList.toggle('show', open);
    document.querySelector('#menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    syncState();
  });
  document.querySelector('#sidebarOverlay')?.addEventListener('click', closeSidebar);
  window.addEventListener('hashchange', () => { closeSidebar(); syncState(); });
  syncState();
</script>
</body>
</html>
